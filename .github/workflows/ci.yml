name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "Casks/**", "design/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 构建与测试
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 构建并测试（ad-hoc 签名）
        run: |
          set -o pipefail
          xcodebuild -project 1shot.xcodeproj -scheme 1shot -destination 'platform=macOS' \
            -derivedDataPath build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            test | tee build.log | grep -E "error:|Executed .* tests|TEST (SUCCEEDED|FAILED)"

      - name: 上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
