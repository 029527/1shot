<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title">
  <title id="title">SnapMark app icon</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#46515F"/>
      <stop offset="1" stop-color="#343D49"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- macOS 图标网格：1024 画布，圆角方块 824×824 偏移 100 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <g transform="translate(185.7 179.7) scale(2.6)">
    <path fill="#E8EAED" d="M199 136 V80 A35 35 0 0 0 164 45 H80 A35 35 0 0 0 45 80 V164 A35 35 0 0 0 80 199 H136 A11 11 0 0 0 136 177 H80 A13 13 0 0 1 67 164 V80 A13 13 0 0 1 80 67 H164 A13 13 0 0 1 177 80 V136 A11 11 0 0 0 199 136 Z"/>
    <path fill="#9DB1C5" d="M182 158 A24 24 0 1 1 182 206 A24 24 0 1 1 182 158 Z"/>
  </g>
</svg>
