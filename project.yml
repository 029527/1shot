name: 1shot
options:
  bundleIdPrefix: com.1shot
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: FYP4TDQ4MV
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "3.1.0"

targets:
  1shot:
    type: application
    platform: macOS
    sources:
      - path: 1shot
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: 1shot/Info.plist
      properties:
        CFBundleDisplayName: 1shot
        CFBundleName: 1shot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleAllowMixedLocalizations: true
        # 检查更新用的 GitHub 仓库（owner/repo）。
        OneShotUpdateRepository: 029527/1shot
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.1shot.app
        PRODUCT_NAME: 1shot
        # Swift 模块名不能以数字开头。
        PRODUCT_MODULE_NAME: OneShot
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  1shotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: 1shotTests
    dependencies:
      - target: 1shot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.1shot.app.tests
        PRODUCT_MODULE_NAME: OneShotTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/1shot.app/Contents/MacOS/1shot
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  1shot:
    build:
      targets:
        1shot: all
        1shotTests: [test]
    test:
      # 测试里断言了中文文案（文件名、提示语），固定用简体中文运行，不受系统语言影响。
      language: zh-Hans
      region: CN
      targets:
        - 1shotTests
    run:
      config: Debug
