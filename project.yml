name: SnapMark
options:
  bundleIdPrefix: com.snapmark
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: FYP4TDQ4MV
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "3.1.0"

targets:
  SnapMark:
    type: application
    platform: macOS
    sources:
      - path: SnapMark
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: SnapMark/Info.plist
      properties:
        CFBundleDisplayName: SnapMark
        CFBundleName: SnapMark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snapmark.SnapMark
        PRODUCT_NAME: SnapMark
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SnapMarkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SnapMarkTests
    dependencies:
      - target: SnapMark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snapmark.SnapMarkTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SnapMark.app/Contents/MacOS/SnapMark
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  SnapMark:
    build:
      targets:
        SnapMark: all
        SnapMarkTests: [test]
    test:
      targets:
        - SnapMarkTests
    run:
      config: Debug
